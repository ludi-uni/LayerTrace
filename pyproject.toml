[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "layertrace"
version = "0.1.0"
description = "Overpaint-based raster to SVG vectorization proof of concept"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
  "CairoSVG>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
layertrace = "layertrace.cli:main"

[tool.setuptools.packages.find]
include = ["layertrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
